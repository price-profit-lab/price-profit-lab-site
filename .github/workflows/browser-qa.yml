name: Calculator and product browser checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'browser-qa.py'
      - 'browser-qa-requirements.txt'
      - '.github/workflows/browser-qa.yml'
      - 'index.html'
      - 'reverse-price-calculator.html'
      - 'price-increase-calculator.html'
      - 'cancellation-calculator.html'
      - 'calculator.js'
      - 'calculator-navigation.js'
      - 'calculator-navigation.test.js'
      - 'profit-margin.js'
      - 'profit-margin.test.js'
      - 'profit-margin-calculator.html'
      - 'reverse-price.js'
      - 'price-increase-calculator.js'
      - 'cancellation-calculator.js'
      - 'style.css'
      - 'product.html'
      - 'service-excel.html'
      - 'product-help.html'
      - 'service-excel-help.html'
      - 'assets/service-standard-excel-mac.png'
      - 'assets/service-pro-actions-excel-mac.png'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: browser-qa-requirements.txt
      - name: Install pinned browser and PDF test dependencies
        run: pip install -r browser-qa-requirements.txt
      - name: Install Chromium and Japanese fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify calculators, PDFs and product pages on localhost
        run: python browser-qa.py
      - name: Retain sample-only screenshots and PDFs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-browser-pdf-checks
          path: browser-qa-output/
          retention-days: 3
          if-no-files-found: ignore
