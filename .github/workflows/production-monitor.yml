name: Production site monitor
on:
  push:
    branches: [main]
    paths:
      - 'production-smoke.test.js'
      - '.github/workflows/production-monitor.yml'
      - 'sitemap.xml'
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live website and sitemap
        run: node production-smoke.test.js
