name: Production site monitor
on:
  push:
    branches: [main]
    paths:
      - 'production-smoke.test.js'
      - 'production-smoke.unit.test.js'
      - '**/*.html'
      - '.github/workflows/production-monitor.yml'
      - 'sitemap.xml'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Push checks can start before Pages has finished publishing the same commit.
      # Daily and manually requested checks run immediately; normal retries remain enabled.
      - name: Allow Pages deployment propagation after a push
        if: github.event_name == 'push'
        run: sleep 60
      - name: Check live website and sitemap
        run: node production-smoke.test.js
