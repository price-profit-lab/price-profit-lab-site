name: Calculator checks
on:
  push:
    branches: [main]
    paths:
      - 'cancellation-calculator.js'
      - 'cancellation-calculator.test.js'
      - 'calculator.js'
      - 'analytics.js'
      - 'analytics-settings.js'
      - 'analytics.test.js'
      - 'calculator-navigation.js'
      - 'calculator-navigation.test.js'
      - 'profit-margin.js'
      - 'profit-margin.test.js'
      - 'profit-margin-calculator.html'
      - 'test-calculator*.js'
      - 'calculator.test.js'
      - 'calculator.dom.test.js'
      - 'reverse-price.js'
      - 'reverse-price.test.js'
      - 'reverse-price.dom.test.js'
      - 'site-audit.test.js'
      - 'production-smoke.test.js'
      - 'production-smoke.unit.test.js'
      - 'site-events.js'
      - 'site-events.test.js'
      - 'en/index.test.js'
      - 'price-increase-calculator.js'
      - 'price-increase-calculator.test.js'
      - 'sitemap.xml'
      - '**/*.html'
      - '.github/workflows/calculator-tests.yml'
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'cancellation-calculator.js'
      - 'cancellation-calculator.test.js'
      - 'calculator.js'
      - 'analytics.js'
      - 'analytics-settings.js'
      - 'analytics.test.js'
      - 'calculator-navigation.js'
      - 'calculator-navigation.test.js'
      - 'profit-margin.js'
      - 'profit-margin.test.js'
      - 'profit-margin-calculator.html'
      - 'test-calculator*.js'
      - 'calculator.test.js'
      - 'calculator.dom.test.js'
      - 'reverse-price.js'
      - 'reverse-price.test.js'
      - 'reverse-price.dom.test.js'
      - 'site-audit.test.js'
      - 'production-smoke.test.js'
      - 'production-smoke.unit.test.js'
      - 'site-events.js'
      - 'site-events.test.js'
      - 'en/index.test.js'
      - 'price-increase-calculator.js'
      - 'price-increase-calculator.test.js'
      - 'sitemap.xml'
      - '**/*.html'
      - '.github/workflows/calculator-tests.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate calculator syntax and legacy regression cases
        run: node --check calculator.js && node test-calculator.js && node test-calculator-ui.js
      - name: Test profit calculation and boundary cases
        run: node en/index.test.js && node cancellation-calculator.test.js && node calculator.test.js && node analytics.test.js && node calculator-navigation.test.js && node profit-margin.test.js && node calculator.dom.test.js && node reverse-price.test.js && node reverse-price.dom.test.js && node site-events.test.js && node price-increase-calculator.test.js && node production-smoke.unit.test.js && node site-audit.test.js
