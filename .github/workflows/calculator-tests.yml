name: Calculator checks
on:
  push:
    branches: [main]
    paths:
      - 'calculator.js'
      - 'calculator.test.js'
      - 'calculator.dom.test.js'
      - 'reverse-price.js'
      - 'reverse-price.test.js'
      - 'reverse-price.dom.test.js'
      - 'site-audit.test.js'
      - 'sitemap.xml'
      - '**/*.html'
      - '.github/workflows/calculator-tests.yml'
  pull_request:
    paths:
      - 'calculator.js'
      - 'calculator.test.js'
      - 'calculator.dom.test.js'
      - 'reverse-price.js'
      - 'reverse-price.test.js'
      - 'reverse-price.dom.test.js'
      - 'site-audit.test.js'
      - 'sitemap.xml'
      - '**/*.html'
      - '.github/workflows/calculator-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test profit calculation and boundary cases
        run: node calculator.test.js && node calculator.dom.test.js && node reverse-price.test.js && node reverse-price.dom.test.js && node site-audit.test.js
