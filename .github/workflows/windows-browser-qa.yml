name: Windows free-tool browser checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: windows-browser-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  windows-browser-pdf:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: browser-qa-requirements.txt
      - name: Install pinned browser and PDF test dependencies
        run: python -m pip install -r browser-qa-requirements.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Record the tested environment
        run: |
          python -c "import platform; print(platform.platform())"
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); print('Chromium', b.version); b.close(); p.stop()"
      - name: Verify free Web tools, layouts and generated PDFs on localhost
        run: python browser-qa.py
      - name: Retain sample-only evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-pdf-checks
          path: browser-qa-output/
          retention-days: 3
          if-no-files-found: ignore
